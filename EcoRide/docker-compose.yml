services:
  # Service for SQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PWD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PWD}
    ports:
      - ${DB_PORTS}:3306
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  # Service for no SQL
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PWD}
    ports:
      - ${MONGO_PORT}:27017
    command: ["mongod", "--auth"]
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  # Service for PHP
  php-fpm:
    build:
      context: .
      dockerfile: config/Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - app_network

  # Service for server
  nginx:
    build:
      context: .
      dockerfile: config/docker-nginx/Dockerfile
    container_name: nginx
    ports:
      - ${NGINX_PORTS}:80
    volumes:
      - ./config/docker-nginx/nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    networks:
      - app_network

# volumes for the services
volumes:
  db_data:
  mongodb_data:

networks:
  app_network:
    driver: bridge
